# Konfiguration des GitHub-Blueprints (Antworten auf START-CHECKLISTE.md und CHECKLISTE.md).
# Zuerst die Start-Checkliste: python3 .github/blueprint/start.py – sie füllt die wichtigsten Werte und setzt
# [start] erledigt = true. Vorher richtet apply.py nichts ein (nur Probelauf).
# Nach dem Ändern: Actions → «Blueprint anwenden» → Run workflow (oder python3 .github/blueprint/apply.py).
# Nur Python-Standardbibliothek (tomllib, Python 3.11+).

[start]
# Start-Checkliste beantwortet? Setzt start.py; ohne «true» richtet apply.py nichts ein (nur Probelauf)
erledigt = false
datum = ""

[projekt]
name = "Mein Projekt"                       # voller Name, z. B. «SekBülach Intranet»
kurz = "Projekt"                            # kurzer Name für Release-Titel («Projekt 0.2.0»)
# Art der Anwendung: «web» (Server/Browser), «desktop» (Installer/App für Windows, macOS, Linux) oder «beides».
# Bestimmt die Vorgaben für «Fehler melden» (Browser bzw. Betriebssystem), die Betriebssysteme der Prüfungen,
# die Tabelle «Unterstützte Versionen» und die Regeln in AGENTS.md. Jede Vorgabe lässt sich unten überschreiben.
art = "web"
verantwortlich = "Projektverantwortliche:r"  # wer freigibt (Rolle, kein Name nötig)
sicherheit_kontakt = "direkt an den Eigentümer dieses Repositorys (E-Mail oder Teams)"
# Datenschutz-Hinweis in allen Issue-Vorlagen; leer = kein Hinweis
datenschutz = "Keine echten Personendaten, Zugangsdaten oder Bildschirmfotos mit Personendaten anhängen."
# Wo sieht man die Version? (für «Fehler melden»)
version_ort = "unter «Versionen» bzw. im Fuss der Anwendung"
# Befehl, der vor jedem Commit alle Prüfungen ausführt (für PR-Vorlage und CONTRIBUTING)
pruefbefehl = "make check"
# Zusätzliche Punkte für die Checkliste der PR-Vorlage, z. B. ["Nur erfundene Testdaten"]
pr_checkliste = []
# Abschnitt «Entwicklungsumgebung» in CONTRIBUTING.md (Markdown), leer = kein Abschnitt
entwicklung = ""
# Abschnitt «Grundsätze» in SECURITY.md, z. B. ["Zugangsdaten nur verschlüsselt speichern"]
sicherheit_grundsaetze = []
# Zusätzlicher Link bei «Neues Issue» (z. B. Doku-Ordner), leer = keiner
doku_url = ""
doku_titel = "Dokumentation"
doku_beschreibung = "Konzepte, Anleitungen und Betrieb."
# Sprache von Oberfläche, Issues und Doku (Vorlagen sind Deutsch, Schweizer Schreibweise)
sprache = "de-CH"
# Sprachen, in denen die Oberfläche ausgeliefert wird (erste = Ausgangssprache), z. B. ["de-CH", "en", "fr"].
# Ab zwei Sprachen: Regel «alle Texte im selben Commit übersetzen» in AGENTS.md, CONTRIBUTING und PR-Checkliste.
sprachen_auslieferung = []
# Lizenz als SPDX-Kennung, z. B. "MIT", "Apache-2.0", "GPL-3.0-or-later"; legt LICENSE aus der GitHub-Vorlage an,
# wenn sie fehlt. Leer = keine (öffentliche Repositorys ohne Lizenz erhalten einen Hinweis).
lizenz = ""
lizenz_inhaber = ""               # Name in der LICENSE (leer = projekt.name)
verhaltenskodex = "auto"          # CODE_OF_CONDUCT.md (Contributor Covenant 2.1, Deutsch); auto: öffentlich an
verhaltenskodex_kontakt = ""      # wohin Verstösse melden (E-Mail); leer = sicherheit_kontakt
sicherheit_antwortzeit = "5 Arbeitstagen"
# Tabelle «Unterstützte Versionen» in SECURITY.md, beim Release nachgeführt; auto: desktop/beides an, web aus
# (bei Web-Anwendungen läuft ohnehin nur der aktuelle Stand)
sicherheit_versionstabelle = "auto"
# Abschnitt «Geltungsbereich» in SECURITY.md: was nicht dazugehört, z. B. ["Plugins von Dritten",
# "Warnungen von SmartScreen/Gatekeeper wegen fehlender Signatur"]; leer = kein Abschnitt
sicherheit_nicht_im_bereich = []

[repository]
# «oeffentlich» oder «privat». Geändert wird die Sichtbarkeit NUR mit «apply.py --sichtbarkeit» (Schutz vor
# versehentlichem Veröffentlichen); «auto»-Werte unten richten sich nach der Sichtbarkeit.
sichtbarkeit = "privat"
standard_branch = "main"          # Workflows des Blueprints erwarten «main»
beschreibung = ""                 # Text bei «About»
webseite = ""
themen = []                       # Topics, z. B. ["schule", "laravel"]
vorlage = false                   # als Template-Repository markieren
issues = true
projekte = true
wiki = "auto"                     # auto: öffentlich an, privat aus
diskussionen = "auto"             # auto: öffentlich an, privat aus
# Pull Requests: «solo» (direkte Pushes, Squash + Rebase) oder «team» (nur Squash, Auto-Merge); auto: privat → solo, öffentlich → team
pr_profil = "auto"
pr_pflicht = "auto"               # Änderungen am Standard-Branch nur über Pull Request (Admins dürfen direkt); auto: öffentlich an
web_commit_signoff = "auto"       # Sign-off bei Commits im Browser (DCO); auto: öffentlich an
secret_scanning = "auto"          # Secret Scanning + Push-Schutz; auto: öffentlich an (privat kostenpflichtig)
branch_schutz = true              # Rulesets: Standard-Branch nicht löschen/force-pushen, Versions-Tags v* unveränderlich
pflicht_pruefungen = []           # Status-Checks, die vor dem Merge grün sein müssen (Job-Namen, z. B. ["ci"])
lineare_historie = "auto"         # keine Merge-Commits auf dem Standard-Branch; auto: öffentlich an

[sponsoring]
# Nur bei öffentlichen Repositorys: erzeugt .github/FUNDING.yml und docs/UNTERSTUETZEN.md. Leer = nicht anzeigen.
github = ""                       # GitHub-Benutzer mit GitHub Sponsors (Profil muss freigeschaltet sein)
buy_me_a_coffee = ""              # Benutzername bei buymeacoffee.com
ko_fi = ""                        # Benutzername bei ko-fi.com
liberapay = ""                    # Benutzername bei liberapay.com
links = []                        # bis 4 eigene Links, z. B. TWINT-/PayPal-Spendenlink oder Projektseite

[social_preview]
# Bild für Link-Vorschauen (1280×640): python3 .github/blueprint/social_preview.py, danach von Hand hochladen
titel = ""                        # leer = projekt.name
untertitel = ""                   # leer = repository.beschreibung
farbe = "#0b3d63"                 # Hintergrund
akzent = "#f2b705"

[issues]
# Auswahl «Bereich» in den Vorlagen
bereiche = ["Allgemein", "Oberfläche", "Schnittstelle / API", "Anmeldung / Rechte", "Dokumentation", "Betrieb / Deployment", "anderes"]
# Zusätzliche Vorlagen: "plugin" (Plugin-Idee), "gui" (GUI-Baustein), "uebersetzung" (Übersetzung einreichen)
zusatzvorlagen = []
# «Fehler melden»: Auswahl Plattform und Variante. "auto" = nach projekt.art
#   web: Browser / Gerät (Chrome, Edge, Firefox, Safari, Smartphone) und Umgebung (Produktion, Test, lokal)
#   desktop: Betriebssystem (Windows 11/10, macOS Apple Silicon/Intel, Linux) und Variante (Installer, Portable, Quellcode)
# Eigene Liste, z. B. ["Windows 11", "macOS"], oder [] = Feld weglassen.
plattformen = "auto"
plattform_titel = "auto"
varianten = "auto"
variante_titel = "auto"
protokoll_ort = ""                # wo das Protokoll liegt, z. B. "~/Projekt/Logs" (erscheint bei «Weitere Hinweise»)
# Vorlage «Übersetzung einreichen»: Sprachen (leer = aus projekt.sprachen_auslieferung) und Ablage der Texte
uebersetzung_sprachen = []
uebersetzung_ablage = ""          # z. B. "lang/*.json" oder "web/i18n/"
# GitHub-Standard-Labels (bug, enhancement, …) entfernen
standard_labels_entfernen = true
# Eigene zusätzliche Labels: { name = "…", farbe = "rrggbb", beschreibung = "…" }
zusatzlabels = []

[meilensteine]
# Sammlungen Fehler / Verbesserungen / Funktionen anlegen und neue Issues danach zuordnen
sammlungen = true
# erster Release-Meilenstein, leer = keiner
erster_release = ""

[versionierung]
# Datei mit der Versionsnummer: VERSION, version.py, package.json, composer.json, pyproject.toml
datei = "VERSION"
startversion = "0.1.0"
# Titel des GitHub-Releases
release_titel = "{kurz} {version}"
# Workflows (Namen), die für den Release-Commit grün sein müssen, z. B. ["deploy"]; leer = sofort
release_nach = []
# Manifeste mit eigener «version», die bei Änderung erhöht werden muss (Globs), leer = keine Prüfung
# z. B. ["plugins/*/plugin.json", "modules/*/module.json"]
plugin_manifeste = []
# Eigene Befehle zum Setzen bzw. Prüfen der Version (für Doku und AGENTS.md); leer lassen = release.py des Blueprints
# release_befehl = "php tools/release.php X.Y.Z --commit"
# release_check_befehl = "php tools/release.php --check"
# Rückwirkende Tags: Datei mit Zeilen «Version Commit», leer = keine
nachtragen_datei = ""
# Nach einer finalen Version die Release-Einträge ihrer Vorabversionen (X.Y.Z-beta.N) samt Dateien entfernen;
# Tags bleiben. Empfohlen für Desktop-Anwendungen mit Beta-Installern (wie TagStudio).
vorabversionen_aufraeumen = false

[release_dateien]
# Dateien am Release, vor allem Installer von Desktop-Anwendungen. Ein Workflow aus versionierung.release_nach lädt
# sie mit actions/upload-artifact hoch; release.yml holt die Artefakte dieses Commits und hängt sie ans Release.
# Web-Anwendungen brauchen das meist nicht (leer lassen).
artefakte = []                    # Namensmuster der Artefakte, z. B. ["installer-*", "app-*.zip"]
pruefsummen = true                # SHA256SUMS.txt beilegen
virustotal = false                # Dateien bei VirusTotal prüfen (Secret VIRUSTOTAL_API_KEY); Funde halten das Release an

[ci]
# Workflow «pruefungen»: Prüfbefehl auf allen Zielsystemen, Fehler als Anmerkungen. Als Pflichtprüfung bzw. für
# release_nach den Namen «pruefungen» verwenden.
aktiv = false
befehl = ""                       # leer = projekt.pruefbefehl
vorbereiten = ""                  # z. B. "npm ci", "composer install --no-interaction", "pip install -r requirements.txt"
betriebssysteme = "auto"          # auto: web → ubuntu; desktop → windows + macos; beides → alle drei
betriebssysteme_beta = []         # bei Vorabversionen nur diese, z. B. ["windows-latest"]; leer = wie oben
# Sprachversionen (leer = nicht einrichten; Listen ergeben eine Matrix, z. B. python = ["3.12", "3.13"]).
# PHP und Composer sind auf den Runnern vorinstalliert.
python = ""
node = ""
java = ""
dotnet = ""
virtueller_bildschirm = false     # Linux: Befehl mit xvfb-run (Oberflächentests von Desktop-Anwendungen)
testausgabe = ""                  # JUnit-XML für die Anmerkungen, z. B. "junit.xml"; leer = Textausgabe auswerten
timeout_minuten = 30
nur_doku_ueberspringen = true     # reine Doku-Änderungen ohne Tests (Job «pruefungen» bleibt grün)
doku_muster = []                  # leer = *.md, docs/**, LICENSE, .github/ISSUE_TEMPLATE/**

[codeql]
# Workflow «CodeQL erweitert»: Funde zusätzlich als Issues. auto: an, wenn Code Scanning verfügbar ist
# (sicherheit.code_scanning) und kein eigener CodeQL-Workflow im Repository liegt; dann schaltet apply.py das
# Standard-Setup aus. false = Standard-Setup wie bisher.
workflow = "auto"
issues = true                     # Funde als Issues (Labels fehler, sicherheit, codeql, triage)
sprachen = "auto"                 # auto: aus den Dateien erkannt; sonst z. B. ["python", "javascript-typescript", "actions"]
build_modus = {}                  # z. B. { "java-kotlin" = "autobuild", "c-cpp" = "manual" }
bau_befehl = ""                   # nur für build_modus «manual»
runner = {}                       # z. B. { "csharp" = "windows-latest" } (Swift läuft immer auf macOS)

[fremdkomponenten]
# Monatliche Prüfung der verwendeten Bibliotheken, Werkzeuge und Dienste (neue Version, Lizenzwechsel, archiviert).
# Die Liste entsteht beim Anwenden aus package.json, composer.json, requirements*.txt, pyproject.toml, *.csproj,
# Cargo.toml und wird von Hand ergänzt (Verwendung, Lizenz, Link).
aktiv = false
datei = "docs/third-party.json"
label = "abhaengigkeiten"

[aufraeumen]
# Workflow «Aufräumen»: abgeschlossene Workflow-Durchläufe löschen, die älter sind als … Tage (neuester je Workflow
# bleibt). 0 = aus; empfohlen 30 bzw. 90 bei öffentlichen Repositorys.
actions_verlauf_tage = 0

[agenten]
# Übergabe zwischen Chats: CLAUDE.md, docs/UEBERGABE.md, docs/PROJEKTSTAND.md und Regel in AGENTS.md
uebergabe = true
projekt_kopie = false             # Kopien als claude/uebergabe.md und claude/projektstand.md im Claude-Projekt führen
konzepte = true                   # docs/KONZEPT-VORLAGE.md (Verbindlichkeitsstufen BESCHLOSSEN/EMPFOHLEN/OFFEN/ZU PRÜFEN)
regeln = []                       # eigene Leitplanken für AGENTS.md, z. B. ["Keine neue Pflicht-Abhängigkeit im Kern"]

[workflows]
# Meilensteine per Kommentar /milestone … auf einem Admin-Issue verwalten
milestone_admin = true
# Nummer des Admin-Issues – wird beim Anwenden automatisch eingetragen (0 = noch nicht angelegt)
admin_issue = 0

[actions]
erlaubte_actions = "ausgewaehlt"  # «alle», «ausgewaehlt» (GitHub-eigene + verifizierte + Liste) oder «nur_github»
verifizierte_erlauben = true      # Actions von verifizierten Erstellern (Marketplace-Haken)
zusaetzlich_erlaubt = []          # weitere Actions, z. B. ["shivammathur/setup-php@*"]
sha_pinning = false               # Actions nur mit Commit-SHA erlauben (sicherer; alle Workflows müssen dann pinnen)
aufbewahrung_tage = "auto"        # Artefakte/Protokolle; auto: öffentlich 90, privat 30
fork_freigabe = "all_external_contributors"  # öffentlich: Workflows aus Forks erst nach Freigabe
oidc_claims = []                  # leer = Standard-Subject; z. B. ["repo", "context"] für Cloud-Anmeldung ohne Schlüssel

[pages]
aktiv = false                     # GitHub Pages über Workflow pages.yml (Ordner «site» bzw. «docs»)
ordner = "docs"

[sicherheit]
dependabot_warnungen = true
dependabot_sicherheitsupdates = true
code_scanning = "auto"            # CodeQL Standard-Setup; auto: öffentlich an (privat nur mit Advanced Security)
private_meldungen = true          # öffentlich: «Report a vulnerability» einschalten

[dependabot]
oekosysteme = ["github-actions"]  # z. B. ["github-actions", "composer", "npm", "pip", "docker"]
intervall = "weekly"
# Neue Paketversionen erst nach so vielen Tagen vorschlagen (Schutz vor frisch veröffentlichten, kompromittierten
# Paketen); Sicherheits-Updates kommen trotzdem sofort. 0 = aus
cooldown_tage = 5
commit_praefix = ""               # Präfix der Commit-Nachrichten, z. B. "CI" oder "deps"; leer = Standard

[copilot]
aktiv = false                     # Copilot-Lizenz vorhanden? Dann Code Review und Coding Agent einrichten
code_review = false               # Copilot prüft Pull Requests automatisch (Ruleset-Regel)

[codespaces]
devcontainer = false              # .devcontainer/devcontainer.json anlegen

[secrets_einstellungen]
# Secrets ohne Wert aus der Umgebung mit Platzhalter anlegen, damit die Namen in GitHub sichtbar sind
platzhalter = true

# --- Umgebungen (Environments) -----------------------------------------------------------------------------
[[umgebungen]]
name = "test"
nur_branches = ["main"]

[[umgebungen]]
name = "produktion"
pruefer = true                    # Deployment nur nach Freigabe durch die Eigentümerin / den Eigentümer
nur_branches = ["main"]
nur_tags = ["v*"]
wartezeit = 0                     # Minuten Wartezeit vor dem Deployment

# --- Variablen (nicht geheim) -----------------------------------------------------------------------------
# bereich = "actions" (ganzes Repository) oder "umgebung:<name>"
[[variablen]]
name = "APP_URL"
wert = "https://test.example.org"
bereich = "umgebung:test"

[[variablen]]
name = "APP_URL"
wert = "https://www.example.org"
bereich = "umgebung:produktion"

[[variablen]]
name = "DEPLOY_HOST"
wert = "server.example.org"
bereich = "umgebung:produktion"

[[variablen]]
name = "DEPLOY_USER"
wert = "deploy"
bereich = "umgebung:produktion"

[[variablen]]
name = "DEPLOY_PFAD"
wert = "/srv/app"
bereich = "umgebung:produktion"

# --- Secrets (Werte nie hier; aus Umgebungsvariablen gleichen Namens oder Platzhalter) ------------------
# bereich = "actions", "umgebung:<name>", "codespaces", "dependabot" oder "agents" (Copilot Coding Agent)
[[secrets]]
name = "DEPLOY_SSH_KEY"
bereich = "umgebung:produktion"
beschreibung = "privater SSH-Schlüssel für das Deployment auf den Server"

[[secrets]]
name = "DEPLOY_KNOWN_HOSTS"
bereich = "umgebung:produktion"
beschreibung = "Ausgabe von ssh-keyscan des Servers"

# Beispiele, bei Bedarf einkommentieren:
# [[secrets]]                     # private Paketquelle für Dependabot
# name = "NPM_TOKEN"
# bereich = "dependabot"
# [[secrets]]                     # Zugang im Codespace
# name = "API_TOKEN_DEV"
# bereich = "codespaces"
# [[secrets]]                     # MCP-Server für den Copilot Coding Agent (Umgebung «copilot»)
# name = "COPILOT_MCP_API_TOKEN"
# bereich = "agents"

# --- Deploy-Keys (öffentlicher Schlüssel als Datei; ohne Datei erscheint die Anleitung als offener Punkt) ---
[[deploy_keys]]
titel = "Server – Pull"
zweck = "Server holt den Code per git pull"
nur_lesen = true
oeffentlicher_schluessel = ""     # z. B. "~/.ssh/projekt-server.pub"

[[deploy_keys]]
titel = "Backup – Spiegel"
zweck = "Sicherung bzw. Spiegel des Repositorys"
nur_lesen = true
oeffentlicher_schluessel = ""

[[deploy_keys]]
titel = "Extern – Push"
zweck = "anderes System schreibt in dieses Repository (z. B. erzeugte Doku)"
nur_lesen = false
oeffentlicher_schluessel = ""

# --- Webhooks (Geheimnis aus Umgebungsvariable) -----------------------------------------------------------
# [[webhooks]]
# url = "https://example.org/github-hook"
# ereignisse = ["issues", "pull_request", "release"]
# secret_env = "WEBHOOK_SECRET"
