name: milestone-admin

# GitHub-Blueprint: Meilensteine per Kommentar verwalten (.github/blueprint/MILESTONE-ADMIN.md).
# Nur einzeilige Kommentare von Owner, Mitgliedern oder Mitwirkenden (author_association); das Skript prüft zusätzlich
# Repository, Admin-Issue ([workflows] admin_issue) und die Berechtigung: OWNER immer, weitere Konten nur aus
# [workflows] milestone_admins in .github/blueprint.toml – so funktioniert es auch in Repositorys von Organisationen.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  milestone-admin:
    if: >-
      ${{ contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/milestone ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Geprüften Befehl ausführen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/blueprint/milestone_admin.py
