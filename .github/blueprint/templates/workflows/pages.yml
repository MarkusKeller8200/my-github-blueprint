name: pages

# GitHub-Blueprint: Inhalt des Ordners «{{pages_ordner}}» als GitHub Pages veröffentlichen (Quelle: GitHub Actions).
on:
  push:
    branches: [main]
    paths: ['{{pages_ordner}}/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '{{pages_ordner}}'
      - id: deployment
        uses: actions/deploy-pages@v4
