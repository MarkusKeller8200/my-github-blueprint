# Konfiguration für das Repository my-github-blueprint SELBST (nicht kopieren – Vorlage für Projekte ist blueprint.toml).
# Anwenden: python3 .github/blueprint/apply.py --config .github/blueprint-repo.toml --nur-github
# (nur GitHub-Einstellungen; keine Dateien, damit Template-Kopien sauber bleiben).
# Nach dem Ändern: Actions → «Blueprint anwenden» → Run workflow (oder python3 .github/blueprint/apply.py).
# Nur Python-Standardbibliothek (tomllib, Python 3.11+).

[projekt]
name = "my-github-blueprint"                       # voller Name, z. B. «SekBülach Intranet»
kurz = "Blueprint"                            # kurzer Name für Release-Titel («Projekt 0.2.0»)
verantwortlich = "Projektverantwortliche:r"  # wer freigibt (Rolle, kein Name nötig)
sicherheit_kontakt = "direkt an den Eigentümer dieses Repositorys (E-Mail oder Teams)"
# Datenschutz-Hinweis in allen Issue-Vorlagen; leer = kein Hinweis
datenschutz = "Keine echten Personendaten, Zugangsdaten oder Bildschirmfotos mit Personendaten anhängen."
# Wo sieht man die Version? (für «Fehler melden»)
version_ort = "unter «Versionen» bzw. im Fuss der Anwendung"
# Befehl, der vor jedem Commit alle Prüfungen ausführt (für PR-Vorlage und CONTRIBUTING)
pruefbefehl = "python3 .github/blueprint/apply.py --probelauf"
# Sprache von Oberfläche, Issues und Doku (Vorlagen sind Deutsch, Schweizer Schreibweise)
sprache = "de-CH"

[repository]
# «oeffentlich» oder «privat». Geändert wird die Sichtbarkeit NUR mit «apply.py --sichtbarkeit» (Schutz vor
# versehentlichem Veröffentlichen); «auto»-Werte unten richten sich nach der Sichtbarkeit.
sichtbarkeit = "oeffentlich"
standard_branch = "main"          # Workflows des Blueprints erwarten «main»
beschreibung = "Vorlage für GitHub-Projekte: Issue-Formulare mit Freigabe (triage → bereit → in Arbeit → Beta-Test), deutsche Labels, Meilensteine, SemVer-Releases per Workflow, Repository-Einstellungen und Checkliste – auf neue oder bestehende Repositorys anwendbar."
webseite = "https://markuskeller8200.github.io/my-github-blueprint/"
themen = ["github-template", "repository-template", "project-template", "blueprint", "github-actions", "issue-templates", "issue-management", "labels", "milestones", "release-automation", "semantic-versioning", "changelog", "keep-a-changelog", "repository-settings", "devops", "agents-md", "python"]
vorlage = true                    # als Template-Repository markieren
issues = true
projekte = true
wiki = "auto"                     # auto: öffentlich an, privat aus
diskussionen = "auto"             # auto: öffentlich an, privat aus
# Pull Requests: «solo» (direkte Pushes, Squash + Rebase) oder «team» (nur Squash, Auto-Merge); auto: privat → solo, öffentlich → team
pr_profil = "auto"
pr_pflicht = false                # Blueprint wird allein gepflegt: direkte Pushes erlaubt (Branch bleibt vor Löschen/Force-Push geschützt)
web_commit_signoff = "auto"       # Sign-off bei Commits im Browser (DCO); auto: öffentlich an
secret_scanning = "auto"          # Secret Scanning + Push-Schutz; auto: öffentlich an (privat kostenpflichtig)
branch_schutz = true              # Rulesets: Standard-Branch nicht löschen/force-pushen, Versions-Tags v* unveränderlich
pflicht_pruefungen = []           # Status-Checks, die vor dem Merge grün sein müssen (Job-Namen, z. B. ["ci"])
lineare_historie = "auto"         # keine Merge-Commits auf dem Standard-Branch; auto: öffentlich an

[sponsoring]
# Nur bei öffentlichen Repositorys: erzeugt .github/FUNDING.yml und docs/UNTERSTUETZEN.md. Leer = nicht anzeigen.
github = ""                       # GitHub-Benutzer mit GitHub Sponsors (Profil muss freigeschaltet sein)
buy_me_a_coffee = ""              # Benutzername bei buymeacoffee.com
ko_fi = ""                        # Benutzername bei ko-fi.com
liberapay = ""                    # Benutzername bei liberapay.com
links = []                        # bis 4 eigene Links, z. B. TWINT-/PayPal-Spendenlink oder Projektseite

[social_preview]
# Bild für Link-Vorschauen (1280×640): python3 .github/blueprint/social_preview.py, danach von Hand hochladen
titel = ""                        # leer = projekt.name
untertitel = ""                   # leer = repository.beschreibung
farbe = "#0b3d63"                 # Hintergrund
akzent = "#f2b705"

[issues]
# Auswahl «Bereich» in den Vorlagen
bereiche = ["Allgemein", "Oberfläche", "Schnittstelle / API", "Anmeldung / Rechte", "Dokumentation", "Betrieb / Deployment", "anderes"]
# Zusätzliche Vorlagen: "plugin" (Plugin-Idee), "gui" (GUI-Baustein)
zusatzvorlagen = []
# GitHub-Standard-Labels (bug, enhancement, …) entfernen
standard_labels_entfernen = true
# Eigene zusätzliche Labels: { name = "…", farbe = "rrggbb", beschreibung = "…" }
zusatzlabels = []

[meilensteine]
# Sammlungen Fehler / Verbesserungen / Funktionen anlegen und neue Issues danach zuordnen
sammlungen = true
# erster Release-Meilenstein, leer = keiner
erster_release = ""

[versionierung]
# Datei mit der Versionsnummer: VERSION, version.py, package.json, composer.json, pyproject.toml
datei = "VERSION"
startversion = "0.1.0"
# Titel des GitHub-Releases
release_titel = "{kurz} {version}"
# Workflows (Namen), die für den Release-Commit grün sein müssen, z. B. ["deploy"]; leer = sofort
release_nach = []
# Manifeste mit eigener «version», die bei Änderung erhöht werden muss (Glob), leer = keine Prüfung
plugin_manifeste = ""
# Rückwirkende Tags: Datei mit Zeilen «Version Commit», leer = keine
nachtragen_datei = ""

[workflows]
# Meilensteine per Kommentar /milestone … auf einem Admin-Issue verwalten
milestone_admin = false
# Nummer des Admin-Issues – wird beim Anwenden automatisch eingetragen (0 = noch nicht angelegt)
admin_issue = 0

[actions]
erlaubte_actions = "ausgewaehlt"  # «alle», «ausgewaehlt» (GitHub-eigene + verifizierte + Liste) oder «nur_github»
verifizierte_erlauben = true      # Actions von verifizierten Erstellern (Marketplace-Haken)
zusaetzlich_erlaubt = []          # weitere Actions, z. B. ["shivammathur/setup-php@*"]
sha_pinning = false               # Actions nur mit Commit-SHA erlauben (sicherer; alle Workflows müssen dann pinnen)
aufbewahrung_tage = "auto"        # Artefakte/Protokolle; auto: öffentlich 90, privat 30
fork_freigabe = "all_external_contributors"  # öffentlich: Workflows aus Forks erst nach Freigabe
oidc_claims = []                  # leer = Standard-Subject; z. B. ["repo", "context"] für Cloud-Anmeldung ohne Schlüssel

[pages]
aktiv = true                      # GitHub Pages über Workflow blueprint-site.yml
ordner = ".github/blueprint-site"

[sicherheit]
dependabot_warnungen = true
dependabot_sicherheitsupdates = true
code_scanning = "auto"            # CodeQL Standard-Setup; auto: öffentlich an (privat nur mit Advanced Security)
private_meldungen = true          # öffentlich: «Report a vulnerability» einschalten

[dependabot]
oekosysteme = ["github-actions"]  # z. B. ["github-actions", "composer", "npm", "pip", "docker"]
intervall = "weekly"

[copilot]
aktiv = false                     # Copilot-Lizenz vorhanden? Dann Code Review und Coding Agent einrichten
code_review = false               # Copilot prüft Pull Requests automatisch (Ruleset-Regel)

[codespaces]
devcontainer = false              # .devcontainer/devcontainer.json anlegen

[secrets_einstellungen]
# Secrets ohne Wert aus der Umgebung mit Platzhalter anlegen, damit die Namen in GitHub sichtbar sind
platzhalter = true

# Umgebungen, Variablen, Secrets und Deploy-Keys braucht der Blueprint selbst nicht.
